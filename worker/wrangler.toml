name = "gautamtalks-signup"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
WORKER_URL = "https://gautamtalks-signup.developwith-gt.workers.dev"
FROM_ADDRESS = "Gautam Talks <hello@gautamtalks.com>"

[[d1_databases]]
binding = "DB"
database_name = "gautamtalks-subs"
database_id = "e477f0c4-cb7e-4503-b7b5-cfa129608d6d"

[[kv_namespaces]]
binding = "RATE"
id = "6eddba5f539640d8a8093c49ce2bc51c"

# Hourly run of scheduled() in worker.js (minute 23 of every hour, UTC): deletes
# unconfirmed signups once they are 29 days old and expires confirmation tokens
# older than 7 days. Hourly + 29 days keeps every unconfirmed row under the 30 days
# the privacy policy promises (worst case 29 days + 1 hour). Without this block
# nothing ever invokes scheduled().
[triggers]
crons = ["23 * * * *"]
