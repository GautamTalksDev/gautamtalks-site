name = "gautamtalks-signup"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
WORKER_URL = "https://gautamtalks-signup.developwith-gt.workers.dev"
FROM_ADDRESS = "Gautam Talks <hello@gautamtalks.com>"

[[d1_databases]]
binding = "DB"
database_name = "gautamtalks-subs"
database_id = "e477f0c4-cb7e-4503-b7b5-cfa129608d6d"

[[kv_namespaces]]
binding = "RATE"
id = "6eddba5f539640d8a8093c49ce2bc51c"

# Daily run of scheduled() in worker.js: deletes unconfirmed signups older than
# 30 days and expires confirmation tokens older than 7 days, which is what the
# privacy policy promises. Without this block nothing ever invokes scheduled().
[triggers]
crons = ["23 4 * * *"]
