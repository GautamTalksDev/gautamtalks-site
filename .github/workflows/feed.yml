- name: Commit if changed
        run: |
          git config user.name "feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/feed.json
          if git diff --cached --quiet; then
            echo "No feed changes. Nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh feed"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            echo "Push attempt $i failed, retrying."
            sleep 5
          done
          echo "Could not push after 3 attempts."
          exit 1
