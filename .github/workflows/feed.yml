name: Refresh YouTube feed
on:
  schedule:
    - cron: "17 5 * * *"   # daily
  workflow_dispatch: {}
# Nothing by default; the one job that pushes gets exactly contents: write.
permissions: {}
concurrency:
  group: feed
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # push data/feed.json
    steps:
      # Pinned to full commit SHAs (a tag can be moved to malicious code; a SHA cannot).
      # Dependabot (.github/dependabot.yml) proposes updates and keeps the comments.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }   # Node 20 reached end of life in April 2026
      - run: node scripts/fetch-feed.mjs
      - name: Commit if changed
        run: |
          git config user.name "feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/feed.json
          if git diff --cached --quiet; then
            echo "No feed changes. Nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh feed"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed, retrying."
            sleep 5
          done
          echo "Could not push after 3 attempts."
          exit 1
